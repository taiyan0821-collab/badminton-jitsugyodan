# Macを持っていなくても、Codemagic(クラウドのMac)でiPhoneアプリを作り、
# TestFlight経由で自分のiPhoneに入れるための設定です。手順は README.md の「iPhoneだけで本物のアプリにする」を参照。
workflows:
  ios-testflight:
    name: iPhoneアプリ(TestFlight)
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Codemagic   # Codemagicに登録したApp Store Connect APIキーの名前
    environment:
      node: 22
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: jp.jitsugyodan.badminton   # capacitor.config.json の appId と同じにする
    scripts:
      - name: 準備
        script: npm ci
      - name: ゲームを組み立ててiPhoneプロジェクトに反映
        script: |
          npm run build
          npx cap sync ios
      - name: 署名の設定
        script: xcode-project use-profiles
      - name: ビルド番号を上げる
        script: cd ios/App && agvtool new-version -all $(($BUILD_NUMBER + 1))
      - name: iPhoneアプリを作る
        script: xcode-project build-ipa --project "ios/App/App.xcodeproj" --scheme "App"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
