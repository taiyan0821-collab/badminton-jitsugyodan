<title>バドミントン実業団物語</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=JetBrains+Mono:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Layout: sticky header + single scrolling column + fixed bottom tab bar; sheets slide up from the bottom. Gym floor drawn on canvas. */
:root{
  --bg:#e9efeb; --panel:#ffffff; --panel2:#f3f6f4; --ink:#14221c; --muted:#5a6b63; --line:#d2dcd6;
  --mat:#2f6e52; --mat2:#275d45; --cline:#f5f8f3; --floor:#dcbd8f; --floor2:#cfac78; --onmat:#ffffff;
  --accent:#d4552a; --team:#24408f; --bk:#3f9a6a; --reg:#1f7a8c; --walk:#8b7a58; --school:#b0558f;
  --good:#2f8a4b; --warn:#b7800d; --bad:#c23b2e;
  --fd:'Dela Gothic One','Hiragino Sans','Noto Sans JP',sans-serif;
  --fb:'Zen Kaku Gothic New','Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif;
  --fm:'JetBrains Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1613; --panel:#16211c; --panel2:#1c2923; --ink:#e4ece7; --muted:#93a59b; --line:#2b3a33;
  --mat:#2b6449; --mat2:#22513c; --cline:#e8efe9; --floor:#6e5839; --floor2:#5f4b2f; --onmat:#ffffff;
  --accent:#ee7444; --team:#86a0f2; --bk:#55b884; --reg:#45a9bb; --walk:#b09f80; --school:#d47db3;
  --good:#4cb46a; --warn:#e0a630; --bad:#e2604f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1613; --panel:#16211c; --panel2:#1c2923; --ink:#e4ece7; --muted:#93a59b; --line:#2b3a33;
  --mat:#2b6449; --mat2:#22513c; --cline:#e8efe9; --floor:#6e5839; --floor2:#5f4b2f; --onmat:#ffffff;
  --accent:#ee7444; --team:#86a0f2; --bk:#55b884; --reg:#45a9bb; --walk:#b09f80; --school:#d47db3;
  --good:#4cb46a; --warn:#e0a630; --bad:#e2604f; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:15px;line-height:1.55;-webkit-tap-highlight-color:transparent}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:760px;margin:0 auto;padding:10px 16px;display:flex;justify-content:space-between;gap:12px;align-items:center}
.brand{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--fd);font-size:15px;color:var(--mat);line-height:1.2}
.hd-team{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-in>div:first-child{min-width:0;flex:1}
.hd-r{text-align:right}
.hd-date{font-size:13px;font-weight:700}
.hol{margin-left:6px;font-size:11px;color:var(--accent);font-weight:700}
.hd-money{font-family:var(--fm);font-variant-numeric:tabular-nums;font-size:15px;font-weight:700}
.neg{color:var(--bad)}
main{max-width:760px;margin:0 auto;padding-block:14px 104px;padding-inline:16px;display:flex;flex-direction:column;gap:14px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(7,1fr)}
.tabs button{appearance:none;border:0;background:none;color:var(--muted);font:500 12px var(--fb);padding:11px 0 13px;position:relative;cursor:pointer}
.tabs button.on{color:var(--ink);font-weight:700}
.tabs button.on::before{content:'';position:absolute;top:0;left:22%;right:22%;height:3px;background:var(--accent);border-radius:0 0 3px 3px}
.tabs.lock{opacity:.35;pointer-events:none}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;min-width:0}
h2,h3{font-family:var(--fd);font-weight:400;margin:0;text-wrap:balance}
h2{font-size:20px}
h3{font-size:15px;margin-bottom:10px}
.sub{color:var(--muted);font-size:12.5px}
.num{font-family:var(--fm);font-variant-numeric:tabular-nums}
.btn{appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:700 14px var(--fb);padding:9px 14px;border-radius:9px;cursor:pointer}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.primary{background:var(--mat);border-color:var(--mat);color:var(--onmat)}
.btn.warn{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.big{width:100%;padding:15px;font-family:var(--fd);font-weight:400;font-size:17px;letter-spacing:.06em}
.btn.sm{padding:6px 10px;font-size:12.5px;border-radius:7px}
.btn.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn:focus-visible,select:focus-visible,input:focus-visible,.pc:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grow{flex:1}
select,input[type=text]{font:500 14px var(--fb);padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);color:var(--ink);max-width:100%}
input[type=range]{width:100%;accent-color:var(--mat)}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:99px;border:1px solid currentColor;line-height:1.5;white-space:nowrap}
.pill.pro{color:var(--accent)} .pill.emp{color:var(--reg)} .pill.bad{color:var(--bad)} .pill.reg{color:var(--reg)} .pill.good{color:var(--good)} .pill.warn{color:var(--warn)}
/* gym */
.gymcard{padding:10px}
.clockbar{display:flex;align-items:center;gap:10px;padding:2px 4px 8px}
.clock{font-family:var(--fm);font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.gstate{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.spd{margin-left:auto;display:flex;gap:6px}
.cvwrap{width:100%}
#gym{display:block;width:100%;border-radius:8px}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11.5px;color:var(--muted);padding:8px 4px 2px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:-1px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 10px;min-width:0}
.kpi b{display:block;font-family:var(--fm);font-variant-numeric:tabular-nums;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi span{font-size:11px;color:var(--muted)}
@media (max-width:480px){.kpis{grid-template-columns:repeat(2,1fr)}}
.evcard{border:2px solid var(--accent);background:color-mix(in srgb,var(--accent) 7%,var(--panel))}
.evcard .ev-name{font-family:var(--fd);font-size:17px}
.vs{display:flex;align-items:center;gap:10px;margin-top:6px;font-weight:700}
.next{font-size:13px;color:var(--muted);margin:0;text-align:center}
.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:13.5px}
.log li{display:flex;gap:8px}
.log time{font-family:var(--fm);font-size:11.5px;color:var(--muted);flex:none;padding-top:2px}
/* timeline */
.tl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
.tl{border-collapse:collapse;font-size:11px;min-width:560px;width:100%;table-layout:fixed}
.tl th{font-family:var(--fm);font-weight:500;color:var(--muted);padding:4px 2px;background:var(--panel2);border-bottom:1px solid var(--line)}
.tl tbody th{width:40px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.tl thead th:first-child{width:40px}
.tl td{border-bottom:1px solid var(--line);border-right:1px dashed var(--line);height:30px;padding:0 4px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.tl td span{display:block;overflow:hidden;text-overflow:ellipsis;font-weight:700}
.c-team{background:color-mix(in srgb,var(--team) 24%,var(--panel));box-shadow:inset 3px 0 var(--team)}
.c-bk{background:color-mix(in srgb,var(--bk) 22%,var(--panel));box-shadow:inset 3px 0 var(--bk)}
.c-reg{background:color-mix(in srgb,var(--reg) 22%,var(--panel));box-shadow:inset 3px 0 var(--reg)}
.c-walk{background:color-mix(in srgb,var(--walk) 18%,var(--panel));box-shadow:inset 3px 0 var(--walk)}
.c-school{background:color-mix(in srgb,var(--school) 22%,var(--panel));box-shadow:inset 3px 0 var(--school)}
.c-match,.c-host{background:color-mix(in srgb,var(--accent) 22%,var(--panel));box-shadow:inset 3px 0 var(--accent)}
/* lists */
.list{display:flex;flex-direction:column;gap:8px}
.rq{display:grid;grid-template-columns:76px 1fr auto;gap:4px 10px;align-items:center;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.rq.a{border-color:var(--bk);background:color-mix(in srgb,var(--bk) 9%,var(--panel))}
.rq-t{font-family:var(--fm);font-size:12.5px;font-weight:700}
.rq-n{min-width:0;font-weight:700;font-size:13.5px}
.rq-n small{display:block;font-weight:400;color:var(--muted);font-size:11.5px}
.rq-f{grid-column:2;font-family:var(--fm);font-size:12.5px;color:var(--muted)}
.rq-b{grid-column:3;grid-row:1/3}
.full{font-size:11.5px;color:var(--muted)}
.pc{appearance:none;text-align:left;width:100%;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:12px;padding:11px 12px;font:inherit;cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:2px 10px}
.pc-top{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.pc-name{font-weight:700;font-size:15px}
.pc-meta{font-size:12px;color:var(--muted);grid-column:1}
.pc-r{grid-column:2;grid-row:1/3;text-align:right}
.ovr{font-family:var(--fd);font-size:26px;line-height:1;color:var(--mat)}
.sd{font-size:11px;color:var(--muted)}
.bars{grid-column:1/3;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
.bar{font-size:10.5px;color:var(--muted)}
.bar div{height:5px;border-radius:3px;background:var(--panel2);overflow:hidden;margin-top:2px}
.bar div i{display:block;height:100%}
.stat{display:grid;grid-template-columns:96px 1fr 30px;gap:8px;align-items:center;font-size:12.5px}
.stat .tr{height:8px;background:var(--panel2);border-radius:4px;position:relative}
.stat .tr i{position:absolute;left:0;top:0;bottom:0;background:var(--mat);border-radius:4px}
.stat .tr b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--accent)}
table.std{width:100%;border-collapse:collapse;font-size:13px}
table.std th,table.std td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left}
table.std th{font-size:11px;color:var(--muted);font-weight:500}
table.std td.n,table.std th.n{text-align:right;font-family:var(--fm);font-variant-numeric:tabular-nums}
tr.me td{font-weight:700;background:color-mix(in srgb,var(--mat) 10%,transparent)}
.seg{display:flex;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;appearance:none;border:0;background:none;color:var(--muted);font:700 13px var(--fb);padding:8px;border-radius:8px;cursor:pointer}
.seg button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.regions{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
@media (max-width:480px){.regions{grid-template-columns:repeat(2,1fr)}}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;padding:4px 0;border-bottom:1px dotted var(--line)}
.kv b{font-family:var(--fm);font-variant-numeric:tabular-nums;font-weight:700}
.kv.tot{border-bottom:0;border-top:2px solid var(--ink);margin-top:4px;padding-top:7px;font-weight:700}
.fac{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.fac small{color:var(--muted);font-size:12px;grid-column:1}
.wk{display:grid;grid-template-columns:30px 1fr 92px;gap:6px;align-items:center;padding:4px 0}
.wk b{font-family:var(--fd);font-weight:400;font-size:14px}
.wk.sun b{color:var(--bad)} .wk.sat b{color:var(--reg)}
/* sheet */
#sheet{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet-bg{position:absolute;inset:0;background:rgba(8,16,12,.5)}
.sheet-card{position:relative;background:var(--bg);width:100%;max-width:760px;max-height:94%;overflow-y:auto;border-radius:16px 16px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.sheet-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.x{appearance:none;border:0;background:var(--panel2);color:var(--ink);width:32px;height:32px;border-radius:50%;font-size:18px;cursor:pointer;flex:none}
.note{font-size:12.5px;color:var(--muted);margin:0}
.err{color:var(--bad);font-weight:700;font-size:13px;margin:0}
.slot{display:grid;grid-template-columns:96px 1fr;gap:6px 10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.slot .sl{font-family:var(--fd);font-size:13px}
.slot .ss{display:flex;flex-direction:column;gap:5px;min-width:0}
.slot select{width:100%}
.slot .pr{grid-column:2;font-size:11.5px;color:var(--muted)}
/* live */
.lv-head{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;text-align:center}
.lv-head .tm{font-weight:700;font-size:13.5px}
.tscore{font-family:var(--fd);font-size:34px;line-height:1}
.tscore em{font-style:normal;color:var(--muted);margin:0 6px}
.lv-cur{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.lv-cur .lbl{font-family:var(--fd);font-size:13px;color:var(--accent)}
.lv-names{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;margin-top:4px}
.lv-names div{font-size:13px;font-weight:700;min-width:0}
.lv-names div:last-child{text-align:right}
.gscore{font-family:var(--fm);font-size:30px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums}
.gprev{font-family:var(--fm);font-size:12px;color:var(--muted);text-align:center}
#lvCv{display:block;width:100%;border-radius:10px}
.lvl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.lvl li{display:grid;grid-template-columns:86px 1fr auto;gap:8px;align-items:center;font-size:12.5px;padding:7px 10px;border-radius:9px;background:var(--panel);border:1px solid var(--line)}
.lvl li.w{border-color:var(--good)} .lvl li.l{border-color:var(--bad)}
.lvl .s{font-family:var(--fm);font-variant-numeric:tabular-nums}
.res-big{font-family:var(--fd);font-size:26px;text-align:center}
.res-big.win{color:var(--good)} .res-big.lose{color:var(--bad)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:13px;font-weight:700;max-width:90%;text-align:center}
.chart svg{width:100%;height:auto;display:block}
.hint{font-size:12.5px;color:var(--muted);background:var(--panel2);border-radius:8px;padding:8px 10px;margin:0}
.start-h{font-family:var(--fd);font-size:28px;color:var(--mat);line-height:1.25}
/* characters & talk */
.av{display:inline-block;border-radius:50%;overflow:hidden;line-height:0;flex:none;border:2px solid var(--line);background:var(--panel2);vertical-align:middle}
.av svg{display:block}
.av.big{border-width:3px}
.pc{grid-template-columns:auto 1fr auto;align-items:center}
.pc-main{min-width:0}
.pc .pc-r{grid-column:3;grid-row:1}
.pc .bars{grid-column:1/-1}
.rq{grid-template-columns:34px 70px 1fr auto}
.rq .av{grid-row:1/3}
.rq .rq-f{grid-column:3}
.rq .rq-b{grid-column:4;grid-row:1/3}
.talkrow{appearance:none;width:100%;display:flex;gap:10px;align-items:center;text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:8px 10px;color:var(--ink);font:inherit;cursor:pointer}
.talkrow:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tr-b{min-width:0;flex:1;font-size:13.5px}
.tr-t{display:block;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.talk{display:flex;gap:14px;align-items:center;min-width:0}
.bubble{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:15px;line-height:1.7;min-width:0}
.btn.choice{text-align:left;padding:12px 14px;width:100%;font-weight:500}
#lvAdv{background:var(--panel);border:2px solid var(--accent);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.adv-btns{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.tac{display:inline-block;font-family:var(--fb);font-size:11px;font-weight:700;color:var(--ink);background:var(--panel2);border-radius:99px;padding:0 8px;margin-left:8px}
.lv-names .av{margin:0 2px 4px}
.wx{margin-left:6px;font-size:11px;font-weight:700;color:var(--reg)}
.pd{border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.pd summary{display:flex;gap:10px;align-items:center;padding:8px 10px;cursor:pointer;list-style:none}
.pd summary::-webkit-details-marker{display:none}
.pd summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:10px}
.pd[open] summary{border-bottom:1px solid var(--line)}
.pd-n{flex:1;min-width:0;font-size:13.5px}
.pd-r{text-align:right;font-size:12px;font-weight:700;color:var(--mat);line-height:1.35;flex:none}
.pd-b{padding:10px;display:flex;flex-direction:column;gap:8px}
.minis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 14px}
@media (max-width:420px){.minis{grid-template-columns:1fr}}
.mini{display:grid;grid-template-columns:78px 1fr 24px;gap:6px;align-items:center;font-size:11.5px}
.mini div{height:6px;background:var(--panel2);border-radius:3px;overflow:hidden}
.mini i{display:block;height:100%;background:var(--mat)}
.mini b{font-family:var(--fm);text-align:right}
.pd-l{font-size:12px;color:var(--muted)}
.seg.sm{padding:2px}.seg.sm button{padding:5px 9px;font-size:12px}
.mtg-room canvas{display:block;width:100%;border-radius:12px;box-shadow:inset 0 0 0 1px var(--line)}
.mtg-line{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.mtg-line p{margin:8px 0 4px;font-size:15px;line-height:1.7}
textarea.code{width:100%;min-height:90px;margin-top:8px;font:12px/1.4 var(--fm);padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);color:var(--ink);word-break:break-all;resize:vertical}
.gear{appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--ink);width:38px;height:38px;border-radius:12px;display:grid;place-items:center;cursor:pointer;flex:none}
.gear:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.title-wrap{position:relative;margin:-18px -16px 0;border-radius:16px 16px 0 0;overflow:hidden}
.title-wrap canvas{display:block;width:100%}
.title-logo{position:absolute;left:0;right:0;top:31%;transform:translateY(-50%);display:flex;flex-direction:column;align-items:center;gap:2px;pointer-events:none}
.tl-sub{font:700 11px var(--fm);letter-spacing:.3em;color:#7a4a1c;background:rgba(255,255,255,.85);padding:2px 10px;border-radius:99px}
.tl-main{font-family:var(--fd);font-size:clamp(28px,8.5vw,44px);line-height:1.15;text-align:center;color:#2f6e52;-webkit-text-stroke:6px #fff;paint-order:stroke fill;text-shadow:0 4px 0 rgba(0,0,0,.12)}
.title-lead{font-size:14px;margin:0;text-align:center}
ul.chg{margin:4px 0 8px;padding-left:1.2em;font-size:13px;line-height:1.7}
#dayFlip{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:rgba(10,20,15,.35);padding:16px;cursor:pointer}

function holidays(y){
  if(HC[y]) return HC[y];
  const m={}, k=(mo,d)=>`${y}-${String(mo).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
  [[1,1,'元日'],[2,11,'建国記念の日'],[2,23,'天皇誕生日'],[4,29,'昭和の日'],[5,3,'憲法記念日'],[5,4,'みどりの日'],[5,5,'こどもの日'],[8,11,'山の日'],[11,3,'文化の日'],[11,23,'勤労感謝の日']].forEach(([a,b,n])=>m[k(a,b)]=n);
  const nm=(mo,n)=>{const f=new Date(y,mo-1,1).getDay();return 1+((8-f)%7)+(n-1)*7;};
  m[k(1,nm(1,2))]='成人の日'; m[k(7,nm(7,3))]='海の日'; m[k(9,nm(9,3))]='敬老の日'; m[k(10,nm(10,2))]='スポーツの日';
  const t=y-1980;
  m[k(3,Math.floor(20.8431+0.242194*t-Math.floor(t/4)))]='春分の日';
  m[k(9,Math.floor(23.2488+0.242194*t-Math.floor(t/4)))]='秋分の日';
  Object.keys(m).sort().forEach(s=>{ if(D(s).getDay()===0){ let n=addD(s,1); while(m[n]) n=addD(n,1); m[n]='振替休日'; } });
  Object.keys(m).forEach(s=>{ const a=addD(s,1); if(!m[a]&&m[addD(s,2)]&&D(a).getDay()!==0) m[a]='国民の休日'; });
  return HC[y]=m;
}

/* ========== players ========== */
function mkStats(lv,sp){const o={};SK.forEach(k=>o[k]=clamp(lv+R(-sp,sp),20,95));return o;}
const pname=g=>pick(SUR)+' '+pick(g==='F'?GF:GM);
function srRaw(p){const s=p.st;return (s.sm*.22+s.df*.18+s.tc*.18+s.fw*.22+s.st*.12+s.mn*.08)*(p.style==='S'?1.04:p.style==='D'?.96:1);}
function drRaw(p){const s=p.st;return (s.sm*.28+s.df*.24+s.tc*.18+s.fw*.12+s.st*.06+s.mn*.12)*(p.style==='D'?1.04:p.style==='S'?.96:1);}
const formF=p=>(.9+.1*(p.cond??70)/100)*(1-(p.fat||0)/350)*(p.inj?.7:1);
const ovr=p=>Math.round(Math.max(srRaw(p),drRaw(p)));
const askPro=p=>Math.round((3000000+Math.max(0,ovr(p)-40)*350000)/100000)*100000;
const askEmp=p=>Math.round((220000+Math.max(0,ovr(p)-40)*3000)/10000)*10000;
const P=id=>S.players.find(p=>p.id===id);
const monthly=p=>p.ct==='pro'?p.sal/12:p.sal;
function newPlayer(lv,age,ct){
  const p={id:'p'+(S.nid++),name:pname(S.team.g),age,st:mkStats(lv,9),style:pick(['S','D','A','A']),pot:0,ct,sal:0,work:ct==='emp'?'desk':'none',fat:R(5,25),cond:R(55,75),inj:0,sat:R(58,72),w:0,l:0,wantPro:Math.random()<.4};
  p.pot=clamp(Math.max(...Object.values(p.st))+(age<=22?R(10,22):age<=26?R(5,12):R(0,5)),40,96);
  p.sal=ct==='pro'?askPro(p):askEmp(p);

  return p;
}
function ensureChar(p){if(!p.lk)p.lk=genLook(S.team.g,p.age);if(!p.tr)p.tr=pick(Object.keys(TRAITS));if(!p.hob)p.hob=pick(HOBBY);if(!p.home)p.home=pick(HOME);}
function genOpp(lv){const o={id:'o'+(S.nid++),name:pname(S.team.g),st:mkStats(lv,8),style:pick(['S','D','A']),cond:70,fat:10,inj:0,lk:genLook(S.team.g,25)};ensureReal(o);return o;}

function satTarget(p){
  const ask=p.ct==='pro'?askPro(p):askEmp(p);
  let t=55+(p.sal/ask-1)*90;
  if(p.ct==='emp'&&p.wantPro) t-=12;
  if(p.ct==='emp'&&p.work==='desk'&&ovr(p)>=62) t-=6;
  if(p.ct==='pro') t+=6;
  if(p.maker) t+=5;
  return clamp(t,0,100);
}

/* ========== league & calendar ========== */
const divName=d=>d===1?'S/Jリーグ':'S/JリーグII';
function satOnOrAfter(s){let d=s;while(dow(d)!==6)d=addD(d,1);return d;}
function leagueDates(Y){const a=satOnOrAfter(`${Y}-11-12`),b=satOnOrAfter(`${Y+1}-01-12`);return [0,1,2,3,4].map(i=>addD(a,i*7)).concat([b,addD(b,7)]);}
function rr(n){const a=[...Array(n).keys()],out=[];for(let r=0;r<n-1;r++){const pairs=[];for(let i=0;i<n/2;i++){let x=a[i],y=a[n-1-i];if((r+i)%2)[x,y]=[y,x];pairs.push([x,y]);}out.push(pairs);a.splice(1,0,a.pop());}return out;}
function newLeague(Y,div){
  let pool=realList(div).filter(([n])=>n!==S.team.name);if(pool.length<7)pool=pool.concat(teamPool(pool.map(x=>x[0]))).slice(0,7);pool=pool.slice(0,7);
  const teams=[{id:'me',name:S.team.name,lv:0,players:[]}].concat(pool.map(([n,lv])=>mkTeam(n,lv+R(-1.5,1.5))));
  const dates=leagueDates(Y);
  return {season:Y,div,teams,rounds:rr(8).map((pairs,i)=>({date:dates[i],pairs,played:false})),table:teams.map(()=>({w:0,l:0,mw:0,ml:0})),done:false};
}
function calendar(Y){
  const ev=[];

    S.league.rounds.forEach((r,i)=>{const pr=r.pairs.find(x=>x[0]===0||x[1]===0);ev.push({date:r.date,type:'league',round:i,opp:pr[0]===0?pr[1]:pr[0],home:pr[0]===0,name:`${divName(S.league.div)} 第${i+1}節`});});

  ev.push({date:`${Y}-12-26`,type:'indiv',key:'sogo',name:'全日本総合選手権',lv:[56,61,66,70,74,78]});
  ev.push({date:`${Y+1}-05-23`,type:'indiv',key:'circuit',name:'日本ランキングサーキット',lv:[53,58,63,67,71,75]});
  ['17','18','19','20','21'].forEach((d,i)=>ev.push({date:`${Y+1}-06-${d}`,type:'jit',round:i,name:`全日本実業団選手権 ${JRN[i]}`,lv:[52,57,62,67,72][i]}));
  ev.push({date:`${Y+1}-09-12`,type:'indiv',key:'shakai',name:'全日本社会人選手権',lv:[48,53,58,63,67,71]});
  intlEvents(Y).forEach(e=>ev.push(e));
  return ev.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
}
function jitShow(e){const Y=seasonOf(e.date);if(!S.jit||S.jit.season!==Y)return e.round===0;return S.jit.alive&&e.round>=S.jit.round;}
function eventOn(date){return calendar(seasonOf(date)).find(e=>e.date===date&&(!e.intl||indPool(e).length>0)&&(e.type!=='jit'||(S.jit&&S.jit.season===seasonOf(date)&&S.jit.alive&&S.jit.round===e.round)))||null;}
function upcoming(n){
  const Y=seasonOf(S.today.date), t=S.today.date;

}
function standings(){const t=S.league.table;return t.map((_,i)=>i).sort((a,b)=>t[b].w-t[a].w||(t[b].mw-t[b].ml)-(t[a].mw-t[a].ml));}

function demand(date,h,walk){

function doPractice(T){
  const ev=eventOn(T.date), m=T.menu, res={menu:m,gains:[],inj:[],train:false};
  const camp=inCamp(T.date), train=!!camp||(!ev&&m.m!=='off'), hrs=camp?2:(S.practice.end-S.practice.start)/3, off=isOffDay(T.date);
  res.train=train;res.camp=camp;

  if(train){const need=Math.ceil(Math.min(S.practice.courts,S.gym.courts)*(S.practice.end-S.practice.start)*.4);if(sell('shuttle',need).lost>0){short=true;res.short=true;}}
  S.players.forEach(p=>{
    if(p.away>0){p.away--;SK.forEach(k=>{if(p.st[k]<p.pot)p.st[k]+=.05;});p.fat=Math.max(0,p.fat-5);return;}
    if(p.rest===T.date){p.fat=Math.max(0,p.fat-12);return;}
    if(p.inj>0){p.inj--;if(p.inj>0&&Math.random()<trainerLv()*.08)p.inj--;p.fat=Math.max(0,p.fat-12);if(!p.inj)res.inj.push(`${p.name}がケガから復帰`);return;}
    if(train){
      const M=camp?{w:{sm:.5,df:.5,tc:.5,fw:.5,st:.5,mn:.3}}:MENU[m.m], I=camp?{g:1.6,f:16}:INT[m.i];
      const ageF=p.age<=22?1.3:p.age<=26?1:p.age<=29?.65:.35;
      const wf=p.ct==='pro'?1.15:off?1:p.work==='desk'?.85:p.work==='coach'?.9:1;
      let t=0;
      for(const k in M.w){
        let g=M.w[k]*I.g*.07*hrs*ageF*wf*R(.6,1.4)*(short?.6:1)*coachMul()*mfxMul(k);
        if(m.m==='phys'&&S.gym.fac.gymroom)g*=1.4;
        if(p.st[k]>=p.pot)g*=.12;
        p.st[k]=Math.min(99,p.st[k]+g); t+=g;
      }
      res.gains.push([p.name,t]);
      if(p.focus&&p.st[p.focus]!=null){p.st[p.focus]=Math.min(99,p.st[p.focus]+.035*hrs*ageF*wf*R(.6,1.4)*(p.st[p.focus]<p.pot?1:.12));p.fat+=1.5;}
      p.fat+=I.f*hrs;
      if(p.fat>65&&(camp||m.i>0)&&Math.random()<(p.fat-65)/450*injMul(p)){res.inj.push(injure(p));}
    } else if(!ev) p.fat-=14;
  });
  if(train&&m.m==='game'){const h=S.players.filter(p=>!p.inj);for(let i=0;i+1<h.length;i+=2){const k=[h[i].id,h[i+1].id].sort().join('-');S.chem[k]=(S.chem[k]||0)+.3;}}
  if(camp){const h=S.players.filter(p=>!unav(p));for(let i=0;i<h.length;i++)for(let j=i+1;j<h.length;j++){const k=[h[i].id,h[j].id].sort().join('-');S.chem[k]=(S.chem[k]||0)+.4;}h.forEach(p=>p.sat=Math.min(100,p.sat+.3));}
  res.gains.sort((a,b)=>b[1]-a[1]);
  return res;
}
function dailyPlayers(){

    p.sat=clamp(p.sat+(satTarget(p)-p.sat)*.04,0,100);
    if(p.age>=29){const d=.008*(p.age-28);p.st.fw=Math.max(20,p.st.fw-d);p.st.st=Math.max(20,p.st.st-d);}
  });
}

function chemB(side){if(side.length<2)return 0;if(side[0].id[0]==='o')return 2;return Math.min(S.chem[[side[0].id,side[1].id].sort().join('-')]||0,30)*.12;}
function aiOrder(pl,fmt){
  const av=pl.filter(p=>!unav(p)), nS=fmt.filter(f=>f.k==='S').length, nD=fmt.filter(f=>f.k==='D').length;
  const singles=[...av].sort((a,b)=>srRaw(b)*formF(b)-srRaw(a)*formF(a)).slice(0,nS);
  let rest=av.filter(p=>!singles.includes(p)).sort((a,b)=>drRaw(b)*formF(b)-drRaw(a)*formF(a));
  if(rest.length<nD*2)rest=rest.concat([...singles].reverse()).slice(0,nD*2);
  let si=0,di=0;
  return fmt.map(f=>f.k==='S'?[singles[si++]]:[rest[di*2],rest[di++*2+1]]);
}
function runTeamMatch(fk,slots,opp,coach){
  const fmt=FMT[fk], os=aiOrder(opp.players,fmt), need=Math.ceil(fmt.length/2), res=[]; let w=0,l=0;
  fmt.forEach((f,i)=>{
    if(fk==='jit'&&(w>=need||l>=need)){res.push(null);return;}
    const A=slots[i].map(P), B=os[i];
    if(A.some(x=>!x)){l++;res.push({k:f.k,l:f.l,A:A.filter(Boolean).map(p=>p.id),B:['(こちらの棄権)'],games:[],win:false});return;}
    if(!B||B.some(x=>!x)){w++;res.push({k:f.k,l:f.l,A:A.map(p=>p.id),B:['(相手棄権)'],games:[],win:true});return;}
    const m=coach&&S.hc?simMatchHC(A,B,f.k):simMatch(A,B,f.k); m.win?w++:l++;
    res.push({k:f.k,l:f.l,A:A.map(p=>p.id),B:B.map(p=>p.name),games:m.games,win:m.win});
  });
  return {fk,opp:opp.name,res,w,l,win:w>l};
}
function oppFor(ev){
  if(ev.type==='league')return S.league.teams[ev.opp];
  if(ev.type==='pm'){const x=S.pms.find(y=>y.id===ev.pmId);return x?x.team:mkTeam('練習相手',55);}
  if(!S.jit.opp||S.jit.opp.round!==ev.round){
    const pool=teamPool(S.league.teams.map(t=>t.name)).sort((a,b)=>Math.abs(a[1]-ev.lv)-Math.abs(b[1]-ev.lv)).slice(0,3),c=pick(pool);
    S.jit.opp={round:ev.round,team:mkTeam(c[0],(c[1]+ev.lv)/2+R(-2,2))};
  }
  return S.jit.opp.team;
}
function applyTeamResult(res,ev){

  const pl=[...new Set(res.res.filter(Boolean).flatMap(m=>m.A))].map(P).filter(Boolean);res.prize=0;

      if(a===0||b===0)return;

    });

    else S.jit.alive=false;
  }
  if(ev.type==='league'||ev.type==='jit')earn('stream',Math.round(sum(S.players.map(p=>p.fans||0))*R(2,4)));
  if(ev.type==='pm'){spend('other',50000);res.res.forEach(m=>{if(m)m.A.forEach(id=>{const p=P(id);p.st.mn=Math.min(99,p.st.mn+.3);p.st.tc=Math.min(99,p.st.tc+.15);});});S.pms=S.pms.filter(x=>x.id!==ev.pmId);}
  S.results.unshift({date:T.date,name:ev.name,txt:`vs ${res.opp}  ${res.w}-${res.l}`,win:res.win});
  log(`${ev.name} vs ${res.opp} ${res.w}-${res.l}で${res.win?'勝利':'敗戦'}`);
  T.matchDone=true; save();
}

function newProspect(r){
  const roll=Math.random(); let lv,age,aff,join,wp;
  if(roll<.45){lv=R(38,52);age=18;aff=pick(PLACE)+'高校 3年';join=true;wp=.3;}
  else if(roll<.85){lv=R(46,60);age=22;aff=pick(PLACE)+pick(['大学','学院大学','体育大学'])+' 4年';join=true;wp=.5;}
  else{lv=R(50,64);age=RI(24,29);aff='元・'+pick(teamPool([]))[0]+'(移籍希望)';join=false;wp=.6;}
  const p=newPlayer(lv,age,'emp'); p.wantPro=Math.random()<wp;
  return {id:'x'+(S.nid++),region:r,aff,join,p,acc:0,status:'open',offer:null};
}
function acceptP(x,ct,sal){
  const ask=ct==='pro'?askPro(x.p):askEmp(x.p);
  let v=(sal/ask-1)*5+(S.fame-30)/25+(S.league.div===1?.6:0)+(S.rep-40)/50;
  if(x.p.wantPro&&ct==='emp')v-=1.2; if(!x.p.wantPro&&ct==='emp')v+=.5;
  return 1/(1+Math.exp(-v));
}
function rosterCount(){return S.players.length+S.pros.filter(x=>x.status==='signed'&&x.join).length;}
function resolveOffer(x){
  if(Math.random()<acceptP(x,x.offer.ct,x.offer.sal)&&rosterCount()<14){
    x.status='signed';
    if(!x.join){const p=x.p;p.ct=x.offer.ct;p.sal=x.offer.sal;p.work=p.ct==='emp'?'desk':'none';p.newJoin=true;S.players.push(p);S.pros=S.pros.filter(y=>y!==x);log(`${p.name}が入団を受諾!本日からチームに合流します`);}
    else log(`${x.p.name}(${x.aff})が内定を受諾。4月1日に入社します`);
  } else {x.status='declined';log(`${x.p.name}がオファーを辞退しました`);}
}

function dailyReal(notes,used,C,out,T){

function genReview(T){

function injMul(p){return (S.gym.fac.gymroom?.7:1)*(1-Math.min(.5,trainerLv()*.08))*(1+.15*sum(Object.values(p.injHist||{})));}
function injure(p){

  const it=INJ[i];p.inj=RI(it.d[0],it.d[1]);p.injPart=it.n;p.injHist=p.injHist||{};p.injHist[it.n]=(p.injHist[it.n]||0)+1;p.injNew=true;

function posMod(s){if(s.length<2)return 0;const a=s[0].pos||'A',b=s[1].pos||'A';if((a==='F'&&b==='B')||(a==='B'&&b==='F'))return 1.5;if(a===b&&a!=='A')return -1.5;return 0;}
function matchupMod(A,B,kind){const la=A.some(p=>p.hand==='L'),lb=B.some(p=>p.hand==='L');let m=(la&&!lb?1.5:0)-(lb&&!la?1.5:0);if(kind==='D')m+=posMod(A)-posMod(B);return m;}
function sigWeak(ms,t,side){const X=side?ms.B:ms.A,Y=side?ms.A:ms.B,sg=TAC_SIG[t]||[],wk=TAC_WEAK[t];return X.filter(p=>sg.includes(p.sig)).length/X.length*1.2+Y.filter(p=>p.weak===wk).length/Y.length*1.8;}

function crisisCheck(rank){

    if(rank<=c.target){S.crisis=null;S.corp.perf=Math.min(98,S.corp.perf+10);S.pendTalks.push({kind:'exec',who:{t:'exec'},text:`${rank}位か。よくやった。役員会でも評価されている。廃部の話は撤回だ。`,ch:['ありがとうございます!']});log('廃部危機を脱しました');}

    else{S.over={date:S.today.date,rank};log('親会社が廃部を決定しました');}
  } else if(!c&&L.season>2026&&(S.corp.perf<40||rank>=7)){
    S.crisis={lvl:1,target:4,season:L.season+1};
    S.pendTalks.push({kind:'exec',who:{t:'exec'},text:`監督、少し話がある。${S.corp.perf<40?'会社の業績が厳しくてね。':''}今季の${rank}位という結果では役員会を説得できない。来季のリーグで4位以内に入れなければ、廃部も検討せざるを得ない。`,ch:['必ず結果で応えます','…厳しいですね']});
    log('親会社から廃部の可能性を告げられました(来季4位以内が条件)');
  }
}

function finishEntry(ev,en,r,lg){
  const A=en.ids.map(P).filter(Boolean),best=bestOf(ev,r),arr=PTS[ev.key]||PTS.shakai,pt=arr[Math.min(r,arr.length-1)];
  A.forEach(p=>{p.rp=(p.rp||0)+pt;if(ev.intl){p.wp=(p.wp||0)+pt*1.5;p.fans=(p.fans||0)+r*120+(best==='優勝'?3000:0);p.fat+=12;p.cond=clamp(p.cond-4,20,100);if(ev.cty!=='日本(東京)')p.away=Math.max(p.away||0,2),p.awayWhy='海外遠征';}});
  S.fame+=r*(ev.intl?2:1.2)+(best==='優勝'?(ev.intl?14:6):0);
  let prize=0;
  if(ev.intl){const usd=(ev.usd||[])[Math.min(r,(ev.usd||[0]).length-1)]||0;if(usd)prize=payPrize(usd*USDJPY,A,r>=2?`${ev.name}(${A.map(p=>p.name).join('/')}・${best}・$${usd.toLocaleString()})`:'','intlPrize');
    const b=ev.bonus?ev.bonus[Math.min(r,ev.bonus.length-1)]:0;if(b){earn('bonus',b);log(`${ev.name}の${best}で親会社から報奨金 ${man(b)}`);}}
  else prize=payPrize((PRZ[ev.key]||PRZ.shakai)[Math.min(r,6)],A,r>=3?`${ev.name}(${A.map(p=>p.name).join('/')}・${best})`:'');
  return {k:en.k,names:A.map(p=>p.name).join(' / '),lg,best,prize,usd:ev.intl?((ev.usd||[])[Math.min(r,(ev.usd||[0]).length-1)]||0):0};
}
function runIndiv(ev,entries,noCost){
  if(ev.intl&&!noCost)spend('other',ev.cost*sum(entries.map(e=>e.ids.length)));
  return entries.map(en=>{
    const A=en.ids.map(P),lg=[];let r=0;
    for(;r<ev.lv.length;r++){const B=indOpp(ev,r,en.k),m=simMatch(A,B,en.k);lg.push({rd:rnd(ev,r),opp:B.map(x=>x.name+(x.cty?`(${x.cty})`:'')).join('/'),sc:m.games.map(g=>`${g.a}-${g.b}`).join(' '),win:m.win});A.forEach(p=>{p.fat+=7;m.win?p.w++:p.l++;if(m.win)p.fans=(p.fans||0)+60;});if(!m.win)break;}
    return finishEntry(ev,en,r,lg);
  });
}

/* ========== match engine & live ========== */
const TACS=[['atk','どんどん攻めろ'],['def','粘ってラリー'],['net','前で勝負'],['back','奥を狙え'],['calm','落ち着いていこう']];
const TACN=Object.fromEntries(TACS);
const SHOTN={serve:'サーブ',clear:'クリアー',lift:'ロブ',drop:'ドロップ',smash:'スマッシュ!',drive:'ドライブ',net:'ヘアピン',push:'プッシュ!'};
const avgS=(s,k)=>sum(s.map(p=>p.st[k]))/s.length;
function sideRate(s,kind){return kind==='S'?srRaw(s[0])*formF(s[0]):(drRaw(s[0])*formF(s[0])+drRaw(s[1])*formF(s[1]))/2+chemB(s);}
function newMS(A,B,kind){const mm=matchupMod(A,B,kind);return {A,B,kind,rA:sideRate(A,kind)+mm/2,rB:sideRate(B,kind)-mm/2,games:[],a:0,b:0,wa:0,wb:0,gi:0,tac:'',otac:'',streak:0,ivl:false,form:[R(-2.5,2.5),R(-2.5,2.5)]};}
function tacMod(ms,t,side){
  if(!t)return 0;
  return tacBase(ms,t,side)+sigWeak(ms,t,side);
}
function tacBase(ms,t,side){
  const X=side?ms.B:ms.A,Y=side?ms.A:ms.B,v=avgS;
  switch(t){
    case 'atk':return (v(X,'sm')-v(Y,'df'))*.18+.4;
    case 'def':return ((v(X,'df')+v(X,'st'))-(v(Y,'sm')+v(Y,'st')))*.09+.3;
    case 'net':return (v(X,'tc')-v(Y,'tc'))*.2+.3;
    case 'back':return (v(X,'tc')-v(Y,'fw'))*.15+.3;
    case 'calm':{const sc=side?ms.b-ms.a:ms.a-ms.b;return (v(X,'mn')-55)*.05+(sc<0?1.5:0);}
  }
  return 0;
}
function nextPoint(ms){
  const d=(ms.rA+ms.form[0])-(ms.rB+ms.form[1])+ms.gi*(avgS(ms.A,'st')-avgS(ms.B,'st'))*.05+tacMod(ms,ms.tac,0)-tacMod(ms,ms.otac,1)+ms.streak*.35;
  let p=.5+d*.0075;if(ms.a>=12&&ms.b>=12)p+=(avgS(ms.A,'mn')-avgS(ms.B,'mn'))*.002;
  p=clamp(p,.25,.75);
  const win=Math.random()<p;win?ms.a++:ms.b++;
  ms.streak=win?Math.min(3,Math.max(0,ms.streak)+1):Math.max(-3,Math.min(0,ms.streak)-1);
  const r={win,wtac:win?ms.tac:ms.otac,long:ms.tac==='def'||ms.otac==='def',gameOver:false};
  if(((ms.a>=15||ms.b>=15)&&Math.abs(ms.a-ms.b)>=2)||ms.a===21||ms.b===21){
    ms.games.push({a:ms.a,b:ms.b});ms.a>ms.b?ms.wa++:ms.wb++;ms.gi++;ms.a=0;ms.b=0;ms.ivl=false;ms.streak=0;ms.form=[R(-2.5,2.5),R(-2.5,2.5)];r.gameOver=true;
  }
  return r;
}
function simMatch(A,B,kind){const ms=newMS(A,B,kind);while(ms.wa<2&&ms.wb<2)nextPoint(ms);return {games:ms.games,win:ms.wa>ms.wb};}
function adviceHints(ms){
  const X=k=>Math.round(avgS(ms.A,k)),Y=k=>Math.round(avgS(ms.B,k));
  const txt={atk:`相手のレシーブ ${Y('df')} に対し、こちらのスマッシュは ${X('sm')}`,def:`粘り合い:こちらのレシーブ+スタミナ ${X('df')+X('st')} / 相手の攻撃+スタミナ ${Y('sm')+Y('st')}`,net:`ネット前の技術 こちら ${X('tc')} / 相手 ${Y('tc')}`,back:`相手のフットワーク ${Y('fw')} に対し、こちらの配球技術 ${X('tc')}`,calm:`こちらのメンタル ${X('mn')}${ms.a<ms.b?'。リードされている今は効果が大きい':''}`};
  const sc=TACS.map(([k])=>[k,tacMod(ms,k,0)]).sort((a,b)=>b[1]-a[1]);
  const wk=[...new Set(ms.B.map(p=>WEAKN[p.weak]).filter(Boolean))].join('・'),sg=[...new Set(ms.A.map(p=>SIGN[p.sig]).filter(Boolean))].join('・'),lf=ms.B.some(p=>p.hand==='L')?'(相手に左利きあり)':'';
  return {best:sc[0][0],lines:sc.slice(0,3).map(([k,v])=>`${v>1.5?'◎':v>0?'○':'△'} ${TACN[k]}:${txt[k]}`).concat([`相手の弱点:${wk}/こちらの得意:${sg}${lf}`])};
}

    const A=slots[i].map(P),B=os[i];
    if(A.some(x=>!x)){l++;res.push({k:f.k,l:f.l,A:A.filter(Boolean).map(p=>p.id),B:['(こちらの棄権)'],games:[],win:false});row.className='l';row.querySelector('.s').textContent='棄権';$('#lvL').textContent=l;continue;}
    if(!B||B.some(x=>!x)){w++;res.push({k:f.k,l:f.l,A:A.map(p=>p.id),B:['(相手棄権)'],games:[],win:true});row.className='w';row.querySelector('.s').textContent='不戦勝';continue;}
    const an=A.map(p=>p.name).join(' / '),bn=B.map(p=>p.name).join(' / ');

      <div class="lv-names"><div>${A.map(p=>`<span class="av">${faceSVG(p.lk,moodOf(p),28)}</span>`).join('')}<br>${esc(an)}</div><div class="gscore">${ms.a}-${ms.b}</div><div>${B.map(p=>`<span class="av">${faceSVG(lookOf(p),'normal',28)}</span>`).join('')}<br>${esc(bn)}</div></div>

  Object.assign(GV,{run:true,people:[],shut:[],occ:[],min:540,spd:1,last:0,end:0,rt:0,clerkBub:null,done});
  gvHour(9);
  const fr=ts=>{
    if(!GV.run)return;
    if(!$('#gym')){GV.run=false;GV.done();return;}
    const dt=GV.last?Math.min(.05,(ts-GV.last)/1000):0;GV.last=ts;GV.rt+=dt;
    const ph=Math.floor(GV.min/60);
    GV.min=Math.min(1320,GV.min+dt*36*GV.spd);
    const h=Math.floor(GV.min/60);if(h!==ph)gvHour(h);
    gvUpdate(dt*Math.min(GV.spd,3));gvDraw();
    const ck=$('#clock');if(ck)ck.textContent=`${String(Math.floor(GV.min/60)).padStart(2,'0')}:${String(Math.floor(GV.min%60)).padStart(2,'0')}`;
    const gs=$('#gstate');if(gs)gs.textContent=GV.min>=1320?'閉館中':'営業中';
    if(GV.min>=1320){GV.end+=dt;if(!GV.people.length||GV.end>2.5){GV.run=false;GV.people=[];GV.shut=[];GV.done();return;}}
    requestAnimationFrame(fr);
  };
  requestAnimationFrame(fr);
}

  chatP:d=>{const p=P(d.id);if(!p)return;if(p.talked===S.today.date)return toast(`${p.name}とは今日もう話しました`);p.talked=S.today.date;const t=playerChat(p);S.talks.unshift(t);openTalk(t.id);},
  buyInv:d=>{const it=INV[d.k],q=+d.q,c=invCost(d.k,q);if(S.money<c)return toast('資金が足りません');orderItem(d.k,q);save();render();toast(`${it.n}を${q}${it.u}発注しました(翌日入荷)`);},
  hire:d=>{const c=S.cands.find(x=>x.id===d.id);if(!c)return;if(S.staff.filter(s=>s.role===c.role).length>=2)return toast('同じ仕事は2人までです');c.since=S.today.date;S.staff.push(c);S.cands=S.cands.filter(x=>x!==c);log(`${c.name}を${ROLE[c.role].n}のアルバイトとして採用しました`);save();render();toast(`${c.name}を採用しました`);},
  fire:d=>{const s=S.staff.find(x=>x.id===d.id);if(!s)return;S.staff=S.staff.filter(x=>x!==s);log(`${s.name}が退職しました`);save();render();},
  host:()=>{const H=UI.host;if(!H||!H.date)return;const K=HOSTK[H.kind];S.hosted.push({id:'h'+(S.nid++),date:H.date,kind:H.kind,fee:H.fee,name:`${S.team.name}杯 ${K.n}`});log(`${fmtShort(H.date)}に${S.team.name}杯 ${K.n}の開催を決定`);save();render();toast('大会の開催を決定しました');},
  hostCancel:d=>{S.hosted=S.hosted.filter(h=>h.id!==d.id);S.rep=Math.max(5,S.rep-2);log('主催大会を中止しました(評判が少し下がりました)');save();render();},
  gsel:d=>{const n=$('#tn').value;UI.g=d.v;openStart();$('#tn').value=n;},
  newGo:()=>{const n=($('#tn').value||'').trim()||'湾岸ロジテック';newGame(n,UI.g);S.seenVer=VERSION;save();closeSheet();UI.tab='gym';render();},
};
const CH={
  price:v=>{S.gym.price=+v;$('#pv').textContent=yen(+v);save();},
  wprice:v=>{S.gym.walkPrice=+v;$('#wv').textContent=yen(+v);save();},
  pStart:v=>{S.practice.start=+v;if(S.practice.end<=+v)S.practice.end=+v+1;save();render();},
  pEnd:v=>{S.practice.end=+v;save();render();},
  pCourts:v=>{S.practice.courts=+v;save();},
  wkM:(v,d)=>{S.week[d.i].m=v;save();render();},
  wkI:(v,d)=>{S.week[d.i].i=+v;save();},
  work:(v,d)=>{P(d.id).work=v;save();if(!$('#sheet').hidden)openPlayer(d.id);render();},
  tmrM:v=>{S.tmr.menu.m=v;S.tmr.menu.why='';save();openBooking();},
  tmrI:v=>{S.tmr.menu.i=+v;save();},
  ord:(v,d)=>{ORD.slots[d.i][d.j]=v;openOrder();},
  indS:(v,d,el)=>{const id=d.id;if(el.checked){if(IND.s.length>=3){el.checked=false;return toast('シングルスは3名まで');}IND.s.push(id);}else IND.s=IND.s.filter(x=>x!==id);},
  indD:(v,d)=>{IND.d[d.i][d.j]=v;},
  impFile:(v,d,el)=>{const f=el.files&&el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>doImport(String(r.result||''));r.onerror=()=>{UI.impMsg='ファイルを読めませんでした。';UI.impOk=false;saveSheet();};r.readAsText(f);},
  pshare:v=>{S.prizeShare=+v;save();},
  priceOff:v=>{S.gym.priceOff=+v;save();},
  memFee:v=>{S.gym.memFee=+v;save();},
  focus:(v,d)=>{P(d.id).focus=v||null;save();},
  cd:v=>{UI.camp.date=v;},
  cdays:v=>{UI.camp.days=+v;render();},
  cplace:v=>{UI.camp.place=v;},
  pmd:v=>{UI.pm.date=v;},
  ip:(v,d)=>{S.inv[d.k].price=+v;save();render();},
  lf:v=>{S.gym.lessonFee=+v;save();},
  sf:v=>{S.gym.stringFee=+v;save();},
  pol:v=>{S.auto.policy=v;save();},
  hd:v=>{UI.host.date=v;},
  hk:v=>{UI.host.kind=v;UI.host.fee=HOSTK[v].fee;render();},
  hf:v=>{UI.host.fee=+v;render();},
  offSal:v=>{UI.off.sal=+v;const x=S.pros.find(y=>y.id===UI.off.id),pr=acceptP(x,UI.off.ct,+v);$('#ofv').textContent=yen(+v);$('#ofp').textContent=pr>.7?'受けてくれそう':pr>.45?'五分五分':pr>.2?'厳しい':'ほぼ無理';},
};
function boot(){
  document.addEventListener('click',e=>{const a=e.target.closest('[data-a]');if(!a||!ACT[a.dataset.a])return;ACT[a.dataset.a](a.dataset,a);});
  document.addEventListener('toggle',e=>{const d=e.target;if(d&&d.classList&&d.classList.contains('pd')){UI.open=UI.open||new Set();d.open?UI.open.add(d.dataset.id):UI.open.delete(d.dataset.id);}},true);
  document.addEventListener('change',e=>{const el=e.target.closest('[data-c]');if(!el||!CH[el.dataset.c])return;CH[el.dataset.c](el.value,el.dataset,el);});
  document.addEventListener('input',e=>{const el=e.target;if(el.dataset.lbl){const l=document.getElementById(el.dataset.lbl);if(l)l.textContent=yen(+el.value);}if(el.dataset.c==='offSal')CH.offSal(el.value,el.dataset,el);});
  window.addEventListener('resize',()=>{if($('#gym')&&!GV.run){gvLayout();gvDraw(S&&S.today.ran?'本日の営業は終了しました':'開館前');}});
  matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',()=>{if($('#gym')&&!GV.run)gvInit();});
  load();
  if((!S||!S.today)&&window.__nativeLoad){window.__nativeLoad(SAVE).then(t=>{if(t){try{S=JSON.parse(t);}catch(e){S=null;}}afterLoad();},()=>afterLoad());return;}
  afterLoad();
}
function afterLoad(){
  if(!S||!S.today||!S.league){S=null;openStart();return;}
  migrate();
  if(S.today.liveStarted&&!S.today.matchDone){const ev=eventOn(S.today.date);if(ev&&ev.type==='indiv'){hcIND(ev);recordIndiv(ev,runIndiv(ev,indEntries(ev),true));log('中断された大会はおまかせで進行しました');}else if(ev&&ev.type!=='indiv'){const fk=fkOf(ev);applyTeamResult(runTeamMatch(fk,aiOrder(S.players,FMT[fk]).map(x=>x.map(p=>p.id)),oppFor(ev)),ev);log('中断された試合はおまかせで進行しました');}S.today.liveStarted=false;save();}
  render();
  if(!updateNotice()&&S.today.ran&&S.tmr)openBooking();
}
if(typeof document!=='undefined'&&document.getElementById('view'))boot();
</script>
